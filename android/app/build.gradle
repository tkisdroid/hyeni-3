apply plugin: 'com.android.application'

import groovy.json.JsonSlurper
import java.util.Locale

def hyeniPackageVersion = new JsonSlurper().parse(file('../../package.json')).version.toString()

def hyeniGitOutput = { arguments ->
    try {
        def process = (["git"] + arguments).execute(null, rootProject.projectDir.parentFile)
        def stdout = process.inputStream.getText("UTF-8").trim()
        def stderr = process.errorStream.getText("UTF-8")
        def exitCode = process.waitFor()
        return exitCode == 0 ? stdout : null
    } catch (Exception ignored) {
        return null
    }
}

def hyeniGitHead = hyeniGitOutput(["rev-parse", "HEAD"])
def hyeniGitStatus = hyeniGitOutput(["status", "--porcelain=v1", "--untracked-files=all"])
def hyeniGitHeadIsValid = hyeniGitHead != null && hyeniGitHead ==~ /(?i)[0-9a-f]{40}/
def hyeniReleaseSourceSha = hyeniGitHeadIsValid ? hyeniGitHead.toLowerCase(Locale.ROOT) : "unavailable"

def isHyeniReleaseArtifactTask = { task ->
    if (task.project.path != project.path) return false
    def taskName = task.name.toLowerCase(Locale.ROOT)
    if (!taskName.contains("release")) return false
    def producesArtifact = taskName.startsWith("assemble")
        || taskName.startsWith("bundle")
        || taskName.startsWith("package")
        || taskName.startsWith("sign")
    def releaseOutput = taskName.endsWith("release")
        || taskName.endsWith("releasebundle")
        || taskName.endsWith("releaseapk")
    return producesArtifact && releaseOutput
}

def hyeniSigningVariableNames = [
    "HYENI_KEYSTORE",
    "HYENI_KEYSTORE_PASSWORD",
    "HYENI_KEY_ALIAS",
    "HYENI_KEY_PASSWORD",
]

def hyeniSigningValue = { name ->
    return System.getenv(name)
}

def hyeniSigningValues = hyeniSigningVariableNames.collectEntries { name ->
    [(name): hyeniSigningValue(name)]
}
def missingHyeniSigningVariables = hyeniSigningVariableNames.findAll { name ->
    def value = hyeniSigningValues[name]
    value == null || !value.toString().trim()
}
gradle.taskGraph.whenReady { graph ->
    def releaseArtifactScheduled = graph.allTasks.any { task ->
        isHyeniReleaseArtifactTask(task)
    }
    if (!releaseArtifactScheduled) return

    def forbiddenSigningProperties = hyeniSigningVariableNames.findAll { name ->
        project.hasProperty(name)
    }
    if (!forbiddenSigningProperties.isEmpty()) {
        throw new GradleException(
            "릴리즈 서명 값은 Gradle property에 저장할 수 없습니다: "
                + forbiddenSigningProperties.join(", ")
        )
    }
    if (!missingHyeniSigningVariables.isEmpty()) {
        throw new GradleException(
            "릴리즈 서명 환경변수가 누락되었습니다: ${missingHyeniSigningVariables.join(", ")}"
        )
    }
    if (!hyeniGitHeadIsValid) {
        throw new GradleException("릴리즈 AAB에 넣을 앱 Git commit SHA를 확인할 수 없습니다.")
    }
    if (hyeniGitStatus == null || !hyeniGitStatus.isEmpty()) {
        throw new GradleException("릴리즈 산출물은 clean 앱 worktree에서만 만들 수 있습니다.")
    }
}

def hyeniKeystorePath = hyeniSigningValues["HYENI_KEYSTORE"]
def hyeniKeystorePassword = hyeniSigningValues["HYENI_KEYSTORE_PASSWORD"]
def hyeniKeyAlias = hyeniSigningValues["HYENI_KEY_ALIAS"]
def hyeniKeyPassword = hyeniSigningValues["HYENI_KEY_PASSWORD"]
def hasHyeniReleaseSigning = missingHyeniSigningVariables.isEmpty()

android {
    namespace = "com.hyeni.calendar"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.hyeni.calendar"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 14
        versionName hyeniPackageVersion
        manifestPlaceholders = [hyeniReleaseSourceSha: hyeniReleaseSourceSha]
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            if (hasHyeniReleaseSigning) {
                storeFile file(hyeniKeystorePath)
                storePassword hyeniKeystorePassword
                keyAlias hyeniKeyAlias
                keyPassword hyeniKeyPassword
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            if (hasHyeniReleaseSigning) {
                signingConfig signingConfigs.release
            }
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    testOptions {
        unitTests {
            it.returnDefaultValues = true
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    implementation 'com.google.android.play:review:2.0.2'
    implementation 'com.android.installreferrer:installreferrer:2.2'
    implementation 'com.android.billingclient:billing:9.0.0'
    // Background location
    implementation 'com.google.android.gms:play-services-location:21.3.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    // WorkManager for reliable service keepalive
    implementation 'androidx.work:work-runtime:2.9.1'
    // Firebase
    implementation platform('com.google.firebase:firebase-bom:34.10.0')
    implementation 'com.google.firebase:firebase-messaging'
    testImplementation "junit:junit:$junitVersion"
    testImplementation 'org.json:json:20231013'
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
