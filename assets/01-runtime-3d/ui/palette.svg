<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <!-- soft-3D palette — 자녀 설정 '테마' 행. settings.webp 라벤더 톤 계열 -->
  <defs>
    <radialGradient id="body" cx="0.32" cy="0.25" r="1.05">
      <stop offset="0" stop-color="#DCCBFA"/>
      <stop offset="0.6" stop-color="#BCA4EE"/>
      <stop offset="1" stop-color="#9678D6"/>
    </radialGradient>
    <radialGradient id="hole" cx="0.4" cy="0.32" r="0.95">
      <stop offset="0" stop-color="#FFF9EE"/>
      <stop offset="1" stop-color="#F2E3D8"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#7C5CE1" flood-opacity="0.30"/>
    </filter>
  </defs>
  <!-- palette body: round blob with thumb notch -->
  <path filter="url(#soft)" fill="url(#body)"
    d="M128 28 C186 28 232 70 232 122 C232 144 218 158 196 158 C180 158 172 150 158 150 C146 150 140 158 140 170 C140 188 152 192 152 206 C152 222 140 230 124 230 C68 228 24 182 24 126 C24 70 70 28 128 28 Z"/>
  <!-- thumb hole -->
  <circle cx="152" cy="196" r="17" fill="url(#hole)"/>
  <!-- paint dots: 혜니 팔레트(로즈/민트/옐로/스카이) -->
  <circle cx="84" cy="86" r="21" fill="#F77FAB"/>
  <circle cx="78" cy="79" r="8" fill="#FFD3E4" opacity="0.9"/>
  <circle cx="150" cy="68" r="21" fill="#FFD76A"/>
  <circle cx="144" cy="61" r="8" fill="#FFF0C2" opacity="0.9"/>
  <circle cx="64" cy="150" r="21" fill="#43CD9B"/>
  <circle cx="58" cy="143" r="8" fill="#C9F3E2" opacity="0.9"/>
  <circle cx="196" cy="112" r="21" fill="#6FB6F8"/>
  <circle cx="190" cy="105" r="8" fill="#D4E9FE" opacity="0.9"/>
  <!-- glint -->
  <ellipse cx="108" cy="46" rx="26" ry="11" fill="#FFFFFF" opacity="0.55" transform="rotate(-14 108 46)"/>
</svg>
