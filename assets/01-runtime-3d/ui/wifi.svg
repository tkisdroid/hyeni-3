<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <!-- soft-3D wifi — 안전지표 네트워크 행. battery.webp 민트 톤과 동일 계열 -->
  <defs>
    <linearGradient id="arc" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7FE3BC"/>
      <stop offset="0.55" stop-color="#31C48D"/>
      <stop offset="1" stop-color="#15936B"/>
    </linearGradient>
    <radialGradient id="dot" cx="0.35" cy="0.3" r="0.9">
      <stop offset="0" stop-color="#FFE9F2"/>
      <stop offset="0.45" stop-color="#F9A8C7"/>
      <stop offset="1" stop-color="#E36C9C"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#15936B" flood-opacity="0.28"/>
    </filter>
  </defs>
  <g filter="url(#soft)" fill="none" stroke="url(#arc)" stroke-linecap="round">
    <path d="M40 118 C66 88 95 73 128 73 C161 73 190 88 216 118" stroke-width="30"/>
    <path d="M73 156 C89 137 107 127 128 127 C149 127 167 137 183 156" stroke-width="29"/>
  </g>
  <circle cx="128" cy="196" r="25" fill="url(#dot)" filter="url(#soft)"/>
  <!-- glints -->
  <ellipse cx="84" cy="92" rx="14" ry="8" fill="#FFFFFF" opacity="0.75" transform="rotate(-24 84 92)"/>
  <ellipse cx="103" cy="139" rx="10" ry="6" fill="#FFFFFF" opacity="0.65" transform="rotate(-22 103 139)"/>
  <circle cx="119" cy="188" r="6" fill="#FFFFFF" opacity="0.8"/>
</svg>
