<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <!-- soft-3D bunny — 자녀 설정 'AI 친구 캐릭터' 행. 혜니 로즈 톤 -->
  <defs>
    <radialGradient id="fur" cx="0.35" cy="0.28" r="1.0">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.65" stop-color="#FDF1F4"/>
      <stop offset="1" stop-color="#EFD6DE"/>
    </radialGradient>
    <linearGradient id="inner" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFD2E2"/>
      <stop offset="1" stop-color="#F49BC0"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#D94F7F" flood-opacity="0.25"/>
    </filter>
  </defs>
  <g filter="url(#soft)">
    <!-- ears -->
    <ellipse cx="92" cy="74" rx="26" ry="54" fill="url(#fur)" transform="rotate(-12 92 74)"/>
    <ellipse cx="164" cy="74" rx="26" ry="54" fill="url(#fur)" transform="rotate(12 164 74)"/>
    <ellipse cx="93" cy="80" rx="13" ry="36" fill="url(#inner)" transform="rotate(-12 93 80)"/>
    <ellipse cx="163" cy="80" rx="13" ry="36" fill="url(#inner)" transform="rotate(12 163 80)"/>
    <!-- head -->
    <ellipse cx="128" cy="164" rx="86" ry="74" fill="url(#fur)"/>
  </g>
  <!-- face -->
  <circle cx="97" cy="158" r="9" fill="#3E2A33"/>
  <circle cx="159" cy="158" r="9" fill="#3E2A33"/>
  <circle cx="100" cy="155" r="3" fill="#FFFFFF"/>
  <circle cx="162" cy="155" r="3" fill="#FFFFFF"/>
  <ellipse cx="128" cy="178" rx="9" ry="7" fill="#F0739F"/>
  <path d="M128 185 C128 194 120 198 114 196 M128 185 C128 194 136 198 142 196"
        fill="none" stroke="#C98FA4" stroke-width="5" stroke-linecap="round"/>
  <!-- blush -->
  <ellipse cx="74" cy="182" rx="13" ry="8" fill="#FBBAD2" opacity="0.85"/>
  <ellipse cx="182" cy="182" rx="13" ry="8" fill="#FBBAD2" opacity="0.85"/>
  <!-- glint -->
  <ellipse cx="96" cy="120" rx="20" ry="9" fill="#FFFFFF" opacity="0.7" transform="rotate(-16 96 120)"/>
</svg>
